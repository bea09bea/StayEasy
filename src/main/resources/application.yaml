spring:
  application:
    name: StayEasy

  datasource:
    url: jdbc:postgresql://127.0.0.1:5444/pgdatabase?sslmode=disable
    username: pguser
    password: pgpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

server:
  port: 5500